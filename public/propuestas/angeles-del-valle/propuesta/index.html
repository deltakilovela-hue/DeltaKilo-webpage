<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta · Ángeles del Valle × Delta Kilo</title>
<meta name="description" content="Propuesta de presencia digital y atención 24/7 para Ángeles del Valle Clínica de Rehabilitación.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Delta Kilo Soluciones">
<meta property="og:title" content="Propuesta · Ángeles del Valle × Delta Kilo">
<meta property="og:description" content="Propuesta de presencia digital y atención 24/7 para Ángeles del Valle Clínica de Rehabilitación.">
<meta property="og:image" content="https://www.deltakilo.com.mx/propuestas/assets/og-image.jpg">
<meta property="og:url" content="https://propuestas.deltakilo.com.mx/angeles-del-valle/propuesta/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--navy:#262d61;--navy2:#181d45;--aqua:#60c5e3;--bg:#e9eff3;--gris:#5b6475}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#1d2340;background:var(--bg);line-height:1.5}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .bar{position:sticky;top:0;z-index:10;background:var(--navy2);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.25)}
  .bar-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bar h1{font-size:15px;font-weight:700;line-height:1.3}
  .bar h1 small{display:block;font-size:12px;font-weight:500;color:#b9dff0}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;background:var(--aqua);color:var(--navy2)}
  .btn.out{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
  main{max-width:860px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
  .page{width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 8px 26px rgba(24,29,69,.18)}
  .end{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:8px}
  .end .btn.out{color:var(--navy);border-color:var(--navy)}
  .fine{text-align:center;font-size:13px;color:var(--gris)}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <h1>Propuesta para Ángeles del Valle<small>Presencia digital y atención 24/7 · Delta Kilo</small></h1>
    <div class="btns">
      <a class="btn" href="propuesta-angeles-del-valle.pdf" download="Propuesta Ángeles del Valle - Delta Kilo.pdf">Descargar PDF</a>
      <a class="btn out" href="../">Ver la página</a>
    </div>
  </div>
</div>

<main>
  <img class="page" src="paginas/pagina-1.jpg" width="1406" height="1988" alt="Página 1 de 4: punto de partida y qué encontramos hoy.">
  <img class="page" src="paginas/pagina-2.jpg" width="1406" height="1988" loading="lazy" alt="Página 2 de 4: qué proponemos. Página web, contenido para redes, Google Maps y agentes de atención 24/7.">
  <img class="page" src="paginas/pagina-3.jpg" width="1406" height="1988" loading="lazy" alt="Página 3 de 4: la primera versión de la página, que va por nuestra cuenta.">
  <img class="page" src="paginas/pagina-4.jpg" width="1406" height="1988" loading="lazy" alt="Página 4 de 4: plan de arranque en 30 días, cómo se vería un día normal y siguientes pasos.">
  <div class="end">
    <a class="btn" href="propuesta-angeles-del-valle.pdf" download="Propuesta Ángeles del Valle - Delta Kilo.pdf">Descargar PDF</a>
    <a class="btn out" href="../">Ver la página</a>
  </div>
  <p class="fine">Delta Kilo · propuesta preparada el 1 de noviembre de 2026</p>
</main>

</body>
</html>
